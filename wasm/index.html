<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport"
	content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy"
	content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self'; style-src 'unsafe-inline'; img-src 'self'">
<title>Wonderland</title>
<style>
	html, body { margin: 0; height: 100%; background: #060410; overflow: hidden;
		touch-action: none; overscroll-behavior: none; }
	canvas { position: fixed; inset: 0; width: 100%; height: 100%;
		object-fit: cover; touch-action: none; }
	#overlay { position: fixed; inset: 0; display: flex; flex-direction: column;
		align-items: center; justify-content: center; gap: 10px;
		background: rgba(6, 4, 16, .45); color: #e8e2ff; cursor: pointer;
		font-family: system-ui, sans-serif; text-align: center; padding: 0 24px;
		text-shadow: 0 2px 12px rgba(0,0,0,.8); }
	#overlay h1 { font-weight: 500; font-size: 26px; margin: 0;
		letter-spacing: .12em; }
	#overlay p { font-size: 14px; margin: 0; opacity: .85; }
	#stick { position: fixed; width: 124px; height: 124px; border-radius: 50%;
		border: 2px solid rgba(232, 226, 255, .35);
		background: rgba(232, 226, 255, .08); display: none;
		pointer-events: none; z-index: 3; }
	#knob { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px;
		border-radius: 50%; background: rgba(232, 226, 255, .35);
		transform: translate(-50%, -50%); }
	.fly { position: fixed; right: 18px; width: 58px; height: 58px;
		border-radius: 50%; border: 2px solid rgba(232, 226, 255, .35);
		background: rgba(232, 226, 255, .10); color: #e8e2ff; display: none;
		align-items: center; justify-content: center; font-size: 22px;
		font-family: system-ui, sans-serif; z-index: 3; user-select: none;
		-webkit-user-select: none; touch-action: none; }
	#flyup { bottom: 108px; }
	#flydown { bottom: 34px; }
</style>
</head>
<body>
<canvas id="rt" width="1920" height="1080"></canvas>
<div id="stick"><div id="knob"></div></div>
<div id="flyup" class="fly">&#9650;</div>
<div id="flydown" class="fly">&#9660;</div>
<div id="overlay">
	<h1>wonderland</h1>
	<p id="enterhint">click to enter</p>
	<p id="controlhint">move the mouse to look around, walk with WASD, fly with Q and E</p>
</div>
<script src="app.js?v=10"></script>
</body>
</html>
